name: Build and deploy Figma plugin
run-name: Build and deploy Figma plugin

on:
  pull_request:
    types: [opened, synchronize, reopened]

  # Manual build on any branch. Manual deploy remains opt-in on main.
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the built plugin to Figma (main branch only)'
        type: boolean
        required: true
        default: false

jobs:
  build_figma_plugin:
    name: Build Figma plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      build_id: ${{ steps.build_info.outputs.build_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.BEP_GITHUB_TOKEN }}

      - name: Verify plugin generator
        run: node --test figma-plugin/plugin.test.mjs

      - name: Build plugin bundle
        run: node scripts/build-figma-plugin.mjs

      - name: Read build id
        id: build_info
        shell: bash
        run: |
          build_id="$(node -p "require('./figma-plugin/dist/build-info.json').buildId")"
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"

      - name: Upload plugin bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: figma-plugin-${{ steps.build_info.outputs.build_id }}
          path: figma-plugin/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Add build summary
        env:
          BUILD_ID: ${{ steps.build_info.outputs.build_id }}
          DEPLOY_REQUESTED: ${{ inputs.deploy }}
          PR_DEPLOY_ALLOWED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: |
          echo "### Figma plugin bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "Build ID: \`${BUILD_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`figma-plugin-${BUILD_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PR_DEPLOY_ALLOWED" == "true" ]]; then
            echo 'Deployment to Figma runs automatically for same-repository PRs.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo 'Build only: deployment and PR comments are skipped for forks and Dependabot.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DEPLOY_REQUESTED" == "true" ]]; then
            echo 'Manual deployment requested (main only).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment download link on PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        env:
          BUILD_ID: ${{ steps.build_info.outputs.build_id }}
        with:
          script: |
            const buildId = process.env.BUILD_ID;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- figma-plugin-bundle -->';
            const body = [
              marker,
              '### 🧩 Figma plugin bundle pronto',
              '',
              `**Build id:** \`${buildId}\``,
              '',
              `Scarica l'artifact **\`figma-plugin-${buildId}\`** dalla [run di questa PR](${runUrl}) (sezione *Artifacts*). Per le PR interne al repository, il job **Deploy plugin to Figma** pubblica automaticamente il bundle dopo il build. Verifica l'esito del job nella stessa run.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy_figma_plugin:
    name: Deploy plugin to Figma
    needs: build_figma_plugin
    # Deploy automatically for same-repository PRs; do not expose an SSO token to forks.
    # Manual deployments remain available on main when explicitly selected.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy == true && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Deliberately no protected environment: PR deployments must run without approval.
    # Store FIGMA_WEB_AUTHN_TOKEN as a repository Actions secret.
    concurrency:
      group: figma-plugin-publication
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download the verified plugin bundle
        uses: actions/download-artifact@v4
        with:
          name: figma-plugin-${{ needs.build_figma_plugin.outputs.build_id }}
          path: figma-plugin/dist/

      - name: Validate plugin manifest and bundled files
        working-directory: figma-plugin/dist
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (!manifest.id) throw new Error('Missing published Figma plugin id in manifest.json');
          // UI is optional: this plugin embeds its HTML in code.js.
          for (const field of ['main', 'ui']) {
            if (field === 'ui' && manifest.ui === undefined) continue;
            if (typeof manifest[field] !== 'string' || !fs.statSync(manifest[field], { throwIfNoEntry: false })?.isFile()) {
              throw new Error(`Missing ${field} file referenced by manifest: ${manifest[field]}`);
            }
          }
          console.log('Manifest and plugin files verified.');
          NODE

      - name: Check Figma token configured
        env:
          FIGMA_WEB_AUTHN_TOKEN: ${{ secrets.FIGMA_WEB_AUTHN_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$FIGMA_WEB_AUTHN_TOKEN" ]]; then
            echo 'FIGMA_WEB_AUTHN_TOKEN is missing or empty' >&2
            exit 1
          fi

      - name: Read current Figma plugin version
        working-directory: figma-plugin/dist
        env:
          FIGMA_WEB_AUTHN_TOKEN: ${{ secrets.FIGMA_WEB_AUTHN_TOKEN }}
        run: npx --yes figcd@0.0.16 current-version --manifest-file ./manifest.json

      - name: Publish plugin to Figma
        working-directory: figma-plugin/dist
        env:
          FIGMA_WEB_AUTHN_TOKEN: ${{ secrets.FIGMA_WEB_AUTHN_TOKEN }}
          BUILD_ID: ${{ needs.build_figma_plugin.outputs.build_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # pull_request builds use the merge commit checked out by checkout.
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            notes="PR #${PR_NUMBER} - build ${BUILD_ID} - commit ${SOURCE_SHA}"
          else
            notes="Manual build ${BUILD_ID} - commit ${SOURCE_SHA}"
          fi
          npx --yes figcd@0.0.16 release \
            --manifest-file ./manifest.json \
            --release-notes "$notes"

      - name: Deployment summary
        env:
          BUILD_ID: ${{ needs.build_figma_plugin.outputs.build_id }}
        run: |
          echo "### Figma deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: \`${BUILD_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow run: \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
