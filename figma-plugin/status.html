<!doctype html>
<html lang="it">
  <meta charset="utf-8" />
  <style>
    :root {
      /* TOKENS */
    }
    body {
      margin: 0;
      padding: var(--space);
      color: var(--foreground);
      background: var(--background);
      font:
        var(--bodySize) / var(--bodyLine) var(--font),
        sans-serif;
    }
    .title {
      color: var(--accent);
      font-size: var(--titleSize);
      line-height: var(--titleLine);
      font-weight: var(--titleWeight);
    }
    pre {
      font: inherit;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: var(--space);
      background: var(--surface);
      border-left: var(--border) solid var(--accent);
    }
    pre[data-state='error'] {
      border-color: var(--error);
    }
  </style>
  <div class="title">BePower · Aggiornamento libreria</div>
  <pre id="status" role="status" aria-live="polite">Avvio del plugin…</pre>
  <div>Attendi il completamento prima di chiudere questa finestra con la X di Figma.</div>
  <script>
    window.onmessage = function (event) {
      if (event.source !== parent) return;
      var message = event.data && event.data.pluginMessage;
      if (!message || message.type !== 'status') return;
      var status = document.getElementById('status');
      status.textContent = 'Build: ' + message.buildId + '\n\n' + message.message;
      status.dataset.state = message.state;
    };
    parent.postMessage({ pluginMessage: { type: 'ready' } }, '*');
  </script>
</html>
